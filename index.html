<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>周贤的画</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:#faf8f5; color:#3d3d3d; -webkit-tap-highlight-color:transparent; overflow:hidden; }

/* 密码门 */
#gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; padding:2rem; }
#gate img.portrait { width:100px; height:auto; border-radius:50%; margin-bottom:1.5rem; opacity:0.85; }
#gate h1 { font-size:clamp(1.5rem,4vw,2rem); font-weight:400; color:#8b7e6a; margin-bottom:2rem; letter-spacing:4px; }
#gate input { border:1px solid #d4c8b8; border-radius:8px; padding:14px 20px; font-size:1.1rem; width:220px; text-align:center; outline:none; background:#fffdf9; color:#5a4e3c; letter-spacing:6px; -webkit-appearance:none; }
#gate input:focus { border-color:#b8a48e; }
#gate button { margin-top:1rem; border:none; background:#8b7e6a; color:#fff; padding:12px 36px; border-radius:8px; font-size:1rem; cursor:pointer; letter-spacing:2px; -webkit-appearance:none; }
#gate button:active { background:#6d6252; }
#gate .hint { margin-top:1.5rem; font-size:0.85rem; color:#b5a794; }

/* 画廊 */
#gallery { display:none; position:fixed; top:0; left:0; width:100%; height:100%; height:100dvh; background:#faf8f5; }
#gallery .header { position:absolute; top:0; left:0; right:0; z-index:10; text-align:center; padding:1rem 1rem 0; pointer-events:none; }
#gallery .header h1 { font-size:1.2rem; font-weight:400; color:#8b7e6a; letter-spacing:4px; }

/* 翻页区 */
.slides { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.slide { position:absolute; width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:60px 20px 100px; opacity:0; transition:opacity 0.35s ease; pointer-events:none; }
.slide.active { opacity:1; pointer-events:auto; }
.slide img { max-width:100%; max-height:70vh; max-height:70dvh; object-fit:contain; border-radius:6px; box-shadow:0 4px 24px rgba(0,0,0,0.08); cursor:pointer; }
.slide .page-num { position:absolute; bottom:80px; left:0; right:0; text-align:center; font-size:0.85rem; color:#b5a794; letter-spacing:2px; }

/* 底部 */
.bottom-bar { position:absolute; bottom:0; left:0; right:0; height:64px; display:flex; align-items:center; justify-content:center; gap:1rem; padding:0 1rem; z-index:10; }
.bottom-bar button { border:1px solid #d4c8b8; background:#fffdf9; color:#8b7e6a; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; line-height:1; }
.bottom-bar button:active { background:#f0ebe0; }
.bottom-bar .dots { display:flex; gap:4px; }
.bottom-bar .dot { width:6px; height:6px; border-radius:50%; background:#d4c8b8; transition:all 0.3s; }
.bottom-bar .dot.active { background:#8b7e6a; width:16px; border-radius:3px; }

#musicPlayer { display:none; }

/* 全屏弹窗 */
#lightbox { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.94); z-index:999; align-items:center; justify-content:center; flex-direction:column; }
#lightbox img { max-width:96vw; max-height:88vh; border-radius:4px; }
#lightbox .close { position:absolute; top:16px;right:24px; color:#ccc; font-size:2rem; cursor:pointer; z-index:1000; }

@media (min-width:768px) {
  .slide img { max-height:75vh; max-width:60vw; }
}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate">
  <img class="portrait" src="portrait-sketch.png?v=1" alt="">
  <h1>周贤的画</h1>
  <input type="password" id="pw" placeholder="密码" maxlength="6" autofocus>
  <button onclick="unlock()">进入</button>
  <p class="hint">一间安静的画室</p>
</div>

<!-- 画廊 -->
<div id="gallery">
  <div class="header"><h1>周贤的画</h1></div>
  <div class="slides" id="slides"></div>
  <div class="bottom-bar">
    <button onclick="prevSlide()">◂</button>
    <div class="dots" id="dots"></div>
    <button onclick="nextSlide()">▸</button>
    <button id="musicBtn" onclick="toggleMusic()" title="音乐" style="margin-left:4px; width:32px; height:32px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; font-size:1rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b7e6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
  </div>
  <div id="musicPlayer">
    <audio id="bgm" src="music.mp3" loop></audio>
  </div>
</div>

<!-- 弹窗 -->
<div id="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
const CORRECT = '0603';
const REPO = 'rita911018/zhou-xian';
const BRANCH = 'gh-pages';
let currentIdx = 0;
let paintings = [];
let musicOn = false;
let touchStartX = 0, touchStartY = 0;

// ====== 密码 ======
function unlock() {
  if (document.getElementById('pw').value === CORRECT) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('gallery').style.display = 'block';
    sessionStorage.setItem('zx_unlocked', '1');
    loadPaintings();
    setTimeout(() => toggleMusic(), 600);
  } else {
    document.getElementById('pw').style.borderColor = '#c97878';
    setTimeout(() => document.getElementById('pw').style.borderColor = '#d4c8b8', 600);
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
if (sessionStorage.getItem('zx_unlocked') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('gallery').style.display = 'block';
  loadPaintings();
  setTimeout(() => toggleMusic(), 800);
}

// ====== 加载画作 ======
async function loadPaintings() {
  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/images?ref=${BRANCH}`);
    if (!resp.ok) { loadStaticFallback(); return; }
    const files = await resp.json();
    paintings = files.filter(f => f.name.match(/\.(png|jpg|jpeg|webp)$/i)).sort((a,b) => b.name.localeCompare(a.name));
    renderGallery();
  } catch(e) {
    loadStaticFallback();
  }
}

function loadStaticFallback() {
  const imgs = [];
  for (let i = 20; i >= 1; i--) imgs.push({ name: `${String(i).padStart(2,'0')}.png`, download_url: `images/${String(i).padStart(2,'0')}.png` });
  paintings = imgs;
  renderGallery();
}

function renderGallery() {
  const slides = document.getElementById('slides');
  const dots = document.getElementById('dots');
  slides.innerHTML = paintings.map((p, i) => 
    `<div class="slide${i === 0 ? ' active' : ''}" data-idx="${i}" onclick="openLightbox(${i}, event)">
      <img src="${p.download_url || p.name}" alt="" loading="${i < 3 ? 'eager' : 'lazy'}">
      <div class="page-num">${i + 1} / ${paintings.length}</div>
    </div>`
  ).join('');
  dots.innerHTML = paintings.map((_, i) => 
    `<div class="dot${i === 0 ? ' active' : ''}"></div>`
  ).join('');
  currentIdx = 0;
}

// ====== 翻页 ======
function goSlide(idx) {
  if (idx < 0 || idx >= paintings.length) return;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.querySelector(`.slide[data-idx="${idx}"]`).classList.add('active');
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.dot')[idx].classList.add('active');
  currentIdx = idx;
}
function nextSlide() { goSlide((currentIdx + 1) % paintings.length); }
function prevSlide() { goSlide((currentIdx - 1 + paintings.length) % paintings.length); }

// 触摸滑动
document.addEventListener('DOMContentLoaded', () => {
  const gallery = document.getElementById('gallery');
  gallery.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
  gallery.addEventListener('touchend', e => {
    const dx = touchStartX - e.changedTouches[0].clientX;
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      dx > 0 ? nextSlide() : prevSlide();
    }
  });
});
// 键盘翻页
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'flex') {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  }
});

// ====== 全屏 ======
function openLightbox(idx, e) {
  if (e) e.stopPropagation();
  document.getElementById('lightbox').style.display = 'flex';
  document.getElementById('lb-img').src = paintings[idx].download_url || paintings[idx].name;
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('lightbox').style.display === 'flex') closeLightbox();
});

// ====== 音乐 ======
function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  const audio = document.getElementById('bgm');
  if (!musicOn) {
    audio.play().catch(() => {});
    musicOn = true;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b8e6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    btn.style.animation = 'pulse 3s ease-in-out infinite';
  } else {
    audio.pause();
    musicOn = false;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b7e6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    btn.style.animation = '';
  }
}
</script>

<style>
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
</style>
</body>
</html>
